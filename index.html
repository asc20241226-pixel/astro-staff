<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ASTRO シフト提出</title><script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#F4F3EE;color:#141A2E}header{background:#111;color:#FFCC00;padding:14px 16px;font-weight:900;font-size:18px;display:flex;justify-content:space-between;align-items:center}header span{color:#fff;font-size:13px;font-weight:700}.wrap{padding:12px 12px 120px}.msg{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;height:44px;border-radius:10px;border:1.5px solid #141A2E;background:#fff;font-weight:800;font-size:14px}.tabs button.on{background:#141A2E;color:#FFCC00}.all{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;font-size:12px;align-items:center}.all button{height:34px;border-radius:8px;border:1px solid #C9C6BB;background:#fff;font-size:12px;padding:0 10px}.day{background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px}.d{width:64px;font-weight:900;font-size:16px}.d small{display:block;font-size:11px;font-weight:700;color:#5A5F6B}.sun .d,.sun .d small{color:#B42318}.sat .d,.sat .d small{color:#1D4ED8}.opts{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.opts button{height:42px;border-radius:8px;border:1px solid #D9D6CC;background:#FAFAF7;font-size:12px;font-weight:700;color:#3D4150}.opts button.on.k0{background:#FFCC00;border-color:#FFCC00;color:#141A2E}.opts button.on.k1{background:#141A2E;border-color:#141A2E;color:#fff}.opts button.on.k2{background:#16A34A;border-color:#16A34A;color:#fff}.opts button.on.k3{background:#9A9DA6;border-color:#9A9DA6;color:#fff}.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(0,0,0,.08)}.foot div{font-size:12px;color:#5A5F6B;margin-bottom:6px;text-align:center}.foot button{width:100%;height:52px;border:0;border-radius:12px;background:#FFCC00;font-size:17px;font-weight:900;color:#141A2E}.foot button:disabled{opacity:.4}select{width:100%;height:48px;font-size:16px;border-radius:10px;border:1px solid #C9C6BB;padding:0 10px;margin:8px 0}.big{width:100%;height:50px;border:0;border-radius:12px;background:#FFCC00;font-size:16px;font-weight:900}.ng{color:#8A1C14;font-weight:700}</style></head><body><header>ASTRO シフト提出<span id="who"></span></header><div class="wrap" id="app"><div class="msg">読み込み中…</div></div><script>var LIFF_ID="2012816036-dHnf7VvX",API="https://script.google.com/macros/s/AKfycbzeSjcZ-AmVS12Y68j64GarYDPBvpqBiwB93BIiYEXcLXIgVL8dcWgTwImy-OjYYxm8/exec",K=["日勤のみ","夜勤のみ","日勤・夜勤ともに可","不可"],S=["日勤","夜勤","両方","×"],D=null,cur=0,sel={},tok="";function $(i){return document.getElementById(i)}function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}function err(e){$("app").innerHTML="<div class=msg><span class=ng>"+esc(e&&e.message||e)+"</span></div>"}function call(fn,args,ok){fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);ok(j.result)}).catch(err)}liff.init({liffId:LIFF_ID}).then(function(){if(!liff.isLoggedIn()){liff.login();return}tok=liff.getIDToken();call("liffInit",[tok],start)}).catch(err);function start(d){D=d;if(!d.ok)return link(d);$("who").textContent=d.staff.name+" さん";d.months.forEach(function(m){sel[m.ym]=m.prev||{}});cur=d.months.length>1?1:0;draw()}function link(d){var h="<div class=msg>はじめて使う方は、自分の名前を選んで<b>本人確認の申請</b>をしてください。管制が確認したら、シフトを出せるようになります。<br><small>LINEの名前：" + esc(d.lineName) + "</small></div>";if(d.pending){h+="<div class=msg>「"+esc(d.pending.name)+"」さんとして申請中です。管制の確認をお待ちください。</div>"}else{h+="<div class=msg><select id=sn><option value=\"\">名前を選んでください</option>"+d.staff.map(function(s){return"<option value=\""+esc(s.no)+"\">"+esc(s.name)+"</option>"}).join("")+"</select><button class=big id=req>この名前で申請する</button></div>"}$("app").innerHTML=h;if($("req"))$("req").onclick=function(){var v=$("sn").value;if(!v)return;this.disabled=true;call("liffLinkRequest",[tok,v],function(r){if(r.done)location.reload();else{$("app").innerHTML="<div class=msg>「"+esc(r.name)+"」さんとして申請しました。管制の確認をお待ちください。</div>"}})}}function draw(){var m=D.months[cur],s=sel[m.ym],n=0,h="";if(D.months.length>1){h+="<div class=tabs>"+D.months.map(function(x,i){return"<button data-t="+i+(i===cur?" class=on":"")+">"+esc(x.title)+"</button>"}).join("")+"</div>"}h+="<div class=all>まとめて：<button data-a=2>全部「両方」</button><button data-a=0>全部「日勤」</button><button data-a=1>全部「夜勤」</button><button data-a=3>全部「×」</button></div>";m.days.forEach(function(d){var v=s[d.ds];if(v)n++;h+="<div class=\"day "+(d.w===0?"sun":d.w===6?"sat":"")+"\"><div class=d>"+d.label+"<small>("+d.wd+")</small></div><div class=opts>"+K.map(function(k,i){return"<button class=\"k"+i+(v===k?" on":"")+"\" data-d="+d.ds+" data-k="+i+">"+S[i]+"</button>"}).join("")+"</div></div>"});h+="<div class=foot><div>"+n+" / "+m.days.length+" 日 選択済み"+(m.prev?"（前に出した内容を表示中）":"")+"</div><button id=go"+(n<m.days.length?" disabled":"")+">"+esc(m.title)+"を送る</button></div>";$("app").innerHTML=h;if($("go"))$("go").onclick=function(){this.disabled=true;this.textContent="送っています…";call("liffSubmit",[tok,m.ym,s],function(r){m.prev=s;$("app").innerHTML="<div class=msg><b>受け付けました ✅</b><br>"+esc(m.title)+"（"+r.count+"日分）"+(r.changed?"<br><small>前回から変わった日："+r.changed+"日</small>":"")+"<br>出し直すときは、もう一度この画面から送ってください。新しく送った方が使われます。</div><button class=big id=back>もどる</button>";$("back").onclick=draw})}}document.addEventListener("click",function(e){var t=e.target;if(t.dataset.t!=null){cur=+t.dataset.t;draw();return}var m=D&&D.ok&&D.months[cur];if(!m)return;if(t.dataset.a!=null){m.days.forEach(function(d){sel[m.ym][d.ds]=K[+t.dataset.a]});draw();return}if(t.dataset.d){sel[m.ym][t.dataset.d]=K[+t.dataset.k];draw()}});</script></body></html>
