<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTRO スタッフ名簿登録</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#F4F3EE;color:#141A2E;font-size:15px}
header{background:#111;color:#FFCC00;padding:14px 16px;font-weight:900;font-size:18px}
.wrap{padding:12px 12px 120px;max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;padding-left:8px;border-left:4px solid #FFCC00}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
label.f em{color:#B42318;font-style:normal;font-size:11px;margin-left:4px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{width:100%;height:46px;border:1px solid #C9C6BB;border-radius:10px;padding:0 10px;font-size:16px;background:#fff}
textarea{height:70px;padding:8px 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:30%;display:flex;align-items:center;justify-content:center;height:44px;border:1px solid #C9C6BB;border-radius:10px;font-weight:700;font-size:14px;background:#FAFAF7}
.seg input{display:none}.seg input:checked+span{color:#141A2E}.seg label:has(input:checked){background:#FFCC00;border-color:#FFCC00}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px;line-height:1.5}
.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.note{font-size:12px;color:#5A5F6B;line-height:1.6}
.pv{font-size:13px;line-height:1.7;background:#FAFAF7;border-radius:10px;padding:10px 12px;max-height:280px;overflow:auto}
.pv b{display:block;margin-top:6px}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.files img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.foot button,.big{width:100%;height:54px;border:0;border-radius:12px;background:#FFCC00;font-size:17px;font-weight:900;color:#141A2E}
.foot button:disabled{opacity:.5}
.ng{color:#8A1C14;font-weight:700}.ok{color:#14532D;font-weight:900;font-size:18px}
.hide{display:none}
</style></head>
<body>
<header>ASTRO スタッフ名簿登録</header>
<div class="wrap" id="app"><div class="card">読み込み中…</div></div>
<script>
var LIFF_ID = "2012816036-dHnf7VvX";
var API = "https://script.google.com/macros/s/AKfycbzeSjcZ-AmVS12Y68j64GarYDPBvpqBiwB93BIiYEXcLXIgVL8dcWgTwImy-OjYYxm8/exec";
var tok = "", FILES = { id_files: [], license_files: [] };
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function err(e) { var m = $("msg"); var t = esc(e && e.message || e); if (m) { m.innerHTML = '<span class="ng">' + t + '</span>'; var b = $("go"); if (b) { b.disabled = false; b.textContent = "この内容で登録する"; } } else $("app").innerHTML = '<div class="card"><span class="ng">' + t + '</span></div>'; }
function call(fn, args, ok) {
  fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { return r.json(); }).then(function (j) { if (j.error) throw new Error(j.error); ok(j.result); }).catch(err);
}
liff.init({ liffId: LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  tok = liff.getIDToken(); call("meiboInit", [tok], start);
}).catch(err);

function seg(name, opts, req) {
  return '<div class="seg">' + opts.map(function (o) { return '<label><input type="radio" name="' + name + '" value="' + esc(o) + '"' + (req ? " required" : "") + '><span>' + esc(o) + '</span></label>'; }).join("") + "</div>";
}
function fld(label, id, type, req, ph) {
  return '<label class="f" for="' + id + '">' + label + (req ? "<em>必須</em>" : "") + '</label><input type="' + (type || "text") + '" id="' + id + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + (type === "tel" ? ' inputmode="tel"' : "") + '>';
}
function start(d) {
  if (d.registered) { $("app").innerHTML = '<div class="card"><div class="ok">登録済みです ✅</div><p>' + esc(d.registered.name) + ' さん（社員番号 ' + esc(d.registered.no) + '）として登録されています。内容を変えたいときは管制に連絡してください。</p></div>'; return; }
  var h = "";
  if (d.pending) h += '<div class="card"><b>' + esc(d.pending.at) + ' に「' + esc(d.pending.name) + '」さんとして送信済みです。</b><div class="note">管制が確認しています。直したいところがあれば、もう一度送ってください（新しい方を使います）。</div></div>';
  h += '<div class="card"><div class="note">12月から、シフト・配置・給与をkintone（クラウドの名簿・管理システム）でまとめて管理します。このLINEと名簿をひもづけるため、一度だけ登録をお願いします。<br>LINEの名前：' + esc(d.lineName) + '</div></div>';
  h += '<div class="card"><h2>基本情報</h2><label class="f">区分<em>必須</em></label>' + seg("reg_type", ["アルバイト", "社員"], 1) +
    fld("氏名（フルネーム）", "name", "text", 1, "例：山田 太郎") + fld("フリガナ", "kana", "text", 1, "例：ヤマダ タロウ") +
    fld("生年月日", "birthday", "date", 1) + fld("電話番号", "tel", "tel", 1, "例：090-1234-5678") + fld("メールアドレス", "email", "email", 0) +
    fld("郵便番号（入れると住所が途中まで入ります）", "zip", "tel", 0, "例：564-0044") + '<div class="note" id="zipmsg"></div><label class="f" for="address">住所<em>必須</em></label><textarea id="address" placeholder="番地・建物名・部屋番号まで"></textarea>' +
    fld("入社日（わかる人だけ）", "hire_date", "date", 0) + "</div>";
  h += '<div class="card"><h2>通勤</h2>' + fld("自宅からの最寄り駅", "station", "text", 0, "例：江坂") +
    '<label class="f" for="dest">交通費を調べる（行き先の駅）</label><div style="display:flex;gap:6px"><input type="text" id="dest" value="江坂" style="flex:1"><button type="button" id="yahoo" style="flex:none;height:46px;padding:0 12px;border:1.5px solid #141A2E;background:#fff;border-radius:10px;font-weight:800;font-size:13px">Yahoo!乗換案内で調べる</button></div>' +
    '<div class="note">自宅の最寄り駅から行き先までの運賃を調べて、下の「片道の交通費」に入れてください。</div>' +
    '<label class="f" for="commute">通勤の方法</label><select id="commute"><option value="">選んでください</option><option>電車・バス</option><option>バイク</option><option>自家用車</option><option>自転車・徒歩</option><option>その他</option></select>' +
    fld("片道の交通費（電車・バス・円）", "fare_oneway", "number", 0) +
    '<label class="f" for="drive_license">運転免許</label><select id="drive_license"><option value="">選んでください</option><option>普通（AT限定）</option><option>普通</option><option>準中型・中型以上</option><option>持っていない</option></select></div>';
  h += '<div class="card"><h2>警備の経験・資格</h2><label class="f">警備の経験<em>必須</em></label>' + seg("experience", ["未経験", "経験者"], 1) +
    '<div id="expbox" class="hide">' + fld("経験年数（年）", "exp_years", "number", 0) + fld("前の警備会社", "prev_company", "text", 0) + "</div>" +
    '<label class="f">持っている警備の資格</label>' + ["交通誘導2級", "交通誘導1級", "雑踏2級", "雑踏1級", "施設2級", "施設1級", "指導教育責任者"].map(function (x) { return '<label class="chk"><input type="checkbox" name="licenses" value="' + x + '">' + x + "</label>"; }).join("") +
    '<label class="f">資格証・修了証の写真</label><input type="file" accept="image/*" multiple data-f="license_files"><div class="files" id="pv_license_files"></div></div>';
  h += '<div class="card"><h2>緊急連絡先</h2>' + fld("氏名", "emg_name", "text", 0) + fld("続柄", "emg_rel", "text", 0, "例：母") + fld("電話番号", "emg_tel", "tel", 0) + "</div>";
  h += '<div class="card"><h2>給与の振込先</h2>' + fld("銀行名", "bank_name", "text", 0, "例：北おおさか信用金庫") + fld("支店名", "bank_branch", "text", 0) +
    '<label class="f">口座の種類</label>' + seg("bank_type", ["普通", "当座"], 0) + fld("口座番号", "bank_no", "tel", 0) + fld("口座名義（カナ）", "bank_holder", "text", 0, "例：ヤマダ タロウ") + "</div>";
  h += '<div class="card"><h2>本人確認書類</h2><div class="note">運転免許証・マイナンバーカードの表面・保険証などの写真。<b>マイナンバーカードは表面だけ</b>（裏面の番号は写さないでください）。</div><input type="file" accept="image/*" multiple data-f="id_files"><div class="files" id="pv_id_files"></div></div>';
  h += '<div class="card"><h2>個人情報の取り扱い</h2><div class="pv">' +
    "<b>使いみち</b>・氏名・生年月日・住所・電話・メール：本人確認、連絡、警備員名簿の作成<br>・緊急連絡先：事故やケガなど、もしものときの連絡<br>・振込先口座：給与の振込<br>・最寄り駅・通勤方法・交通費：交通費の支払い、現場の割り当て<br>・警備の資格・経験：資格が必要な現場への配置、法令で決められた教育の記録<br>・本人確認書類・資格証の写真：本人と資格の確認<br>・LINEのID：本人確認と、シフト・配置のお知らせ" +
    "<b>扱い方</b>・上の目的以外には使いません。法令で必要な場合をのぞき、本人の同意なく社外に出しません。<br>・見られるのは会社の管理担当（管理者・管制・事務）だけです。現場リーダーやほかのスタッフには見えません。<br>・会社が契約しているクラウドサービス（kintone など）に保管します。<br>・退職後は、法令で決められた期間保管したあと削除します。<br>・確認・訂正・削除をしたいときは、管制まで連絡してください。<br>・マイナンバーはこの登録では集めません。" +
    '</div><label class="chk"><input type="checkbox" id="privacy">上の内容を読み、勤務・給与・法令上の名簿の管理に使うことに同意します</label>' +
    '<label class="chk"><input type="checkbox" id="pledge">警備業法第3条の欠格事由（警備員になれない条件）に当てはまりません</label></div>';
  h += '<div id="msg" class="card hide"></div><div class="foot"><button id="go">この内容で登録する</button></div>';
  $("app").innerHTML = h;
  document.querySelectorAll('input[name=experience]').forEach(function (r) { r.onchange = function () { $("expbox").className = r.value === "経験者" ? "" : "hide"; }; });
  $("zip").oninput = function () {
    var z = this.value.replace(/[^0-9０-９]/g, "").replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (z.length !== 7) return;
    $("zipmsg").textContent = "住所を探しています…";
    window.__zip = function (r) {
      var a = r && r.results && r.results[0];
      if (!a) { $("zipmsg").textContent = "この郵便番号の住所が見つかりませんでした。住所は手で入れてください。"; return; }
      var t = a.address1 + a.address2 + a.address3, ad = $("address");
      if (!ad.value.trim() || ad.value.indexOf(t) !== 0) ad.value = t;
      $("zipmsg").textContent = "「" + t + "」まで入れました。続きの番地・建物名を入れてください。";
      ad.focus(); ad.setSelectionRange(ad.value.length, ad.value.length);
    };
    var sc = document.createElement("script");
    sc.src = "https://zipcloud.ibsnet.co.jp/api/search?callback=__zip&zipcode=" + z;
    sc.onerror = function () { $("zipmsg").textContent = "住所の自動入力が使えませんでした。手で入れてください。"; };
    document.body.appendChild(sc);
  };
  $("yahoo").onclick = function () {
    var from = val("station"), to = val("dest");
    if (!from) { alertBox("先に「自宅からの最寄り駅」を入れてください"); return; }
    var url = "https://transit.yahoo.co.jp/search/result?from=" + encodeURIComponent(from) + "&to=" + encodeURIComponent(to || "江坂");
    if (window.liff && liff.isInClient && liff.isInClient()) liff.openWindow({ url: url, external: false }); else window.open(url, "_blank");
  };
  document.querySelectorAll('input[type=file]').forEach(function (inp) { inp.onchange = function () { addFiles(inp.getAttribute("data-f"), inp.files); }; });
  $("go").onclick = submit;
}
/* 写真は長い辺1600pxのJPEGに縮めてから送る */
function addFiles(field, list) {
  Array.prototype.slice.call(list).slice(0, 4).forEach(function (f) {
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL("image/jpeg", 0.82);
      FILES[field].push({ field: field, name: field + "_" + (FILES[field].length + 1) + ".jpg", type: "image/jpeg", b64: data.split(",")[1] });
      var t = document.createElement("img"); t.src = data; $("pv_" + field).appendChild(t);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });
}
function alertBox(t) { var m = $("msg"); m.className = "card"; m.innerHTML = '<span class="ng">' + esc(t) + "</span>"; m.scrollIntoView({ behavior: "smooth" }); }
function val(id) { var e = $(id); return e ? e.value.trim() : ""; }
function radio(n) { var e = document.querySelector('input[name=' + n + ']:checked'); return e ? e.value : ""; }
function submit() {
  var d = { reg_type: radio("reg_type"), experience: radio("experience"), bank_type: radio("bank_type") || "普通",
    licenses: Array.prototype.map.call(document.querySelectorAll('input[name=licenses]:checked'), function (x) { return x.value; }),
    privacy: $("privacy").checked, pledge: $("pledge").checked };
  ["name", "kana", "birthday", "tel", "email", "zip", "address", "hire_date", "station", "commute", "fare_oneway", "drive_license", "exp_years", "prev_company",
    "emg_name", "emg_rel", "emg_tel", "bank_name", "bank_branch", "bank_no", "bank_holder"].forEach(function (k) { d[k] = val(k); });
  var m = $("msg"); m.className = "card";
  var miss = [];
  if (!d.reg_type) miss.push("区分"); if (!d.name) miss.push("氏名"); if (!d.kana) miss.push("フリガナ"); if (!d.birthday) miss.push("生年月日");
  if (!d.tel) miss.push("電話番号"); if (!d.address) miss.push("住所"); if (!d.experience) miss.push("警備の経験");
  if (!d.privacy) miss.push("個人情報の同意"); if (!d.pledge) miss.push("誓約");
  if (miss.length) { m.innerHTML = '<span class="ng">まだ入っていません：' + miss.join("・") + "</span>"; m.scrollIntoView({ behavior: "smooth" }); return; }
  var b = $("go"); b.disabled = true; b.textContent = "送っています…";
  m.innerHTML = "送っています…（写真があると少し時間がかかります）";
  call("meiboSubmit", [tok, d, FILES.id_files.concat(FILES.license_files)], function (r) {
    $("app").innerHTML = '<div class="card"><div class="ok">登録を受け付けました ✅</div>' + (r.fileNg ? '<p class="ng">写真だけうまく送れませんでした。管制から写真をお願いすることがあります。</p>' : '') + '<p>' + esc(d.name) + ' さん、ありがとうございます。管制が確認したら、シフト提出など新しいしくみが使えるようになります。</p><p class="note">直したいところがあれば、もう一度このリンクから送ってください（新しい方を使います）。</p></div>';
  });
}
</script>
</body></html>
